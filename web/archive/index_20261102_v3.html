<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>사장님 공고 확인</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%2321443a'/%3E%3Cpath d='m4 8.5 2.5 2.5 5.5-6' fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--bg:#f4f3ed;--paper:#fff;--ink:#1c211e;--mute:#5d665f;--line:#e2e0d6;--line2:#cfcdc1;--ok:#17603e;--okbg:#e4f1e9;--ask:#7d5200;--askbg:#faf0d7;--askline:#ecdcb0;--no:#962f20;--nobg:#f8e6e1;--org:#3a4566;--orgbg:#e8ebf3;--brand:#21443a;--brand2:#2d5a4d;--brandbg:#e9efec;--s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px}
*{box-sizing:border-box}html{scrollbar-color:var(--line2) transparent}::selection{background:#cfe3d8;color:var(--ink)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Pretendard Variable",Pretendard,system-ui,sans-serif;font-variant-numeric:tabular-nums;word-break:keep-all;overflow-wrap:anywhere;-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--brand2);outline-offset:2px}a{color:inherit}svg{flex:none}
header{background:var(--brand);color:#fff}header div{max-width:1200px;margin:auto;padding:20px 24px}header h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.02em}header p{margin:4px 0 0;font-size:14px;color:#d8e5df;max-width:70ch}
main{display:grid;grid-template-columns:320px minmax(0,1fr);gap:var(--s5);padding:var(--s5);max-width:1200px;margin:auto;align-items:start}
aside{position:sticky;top:var(--s4);background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:20px}
h2{font-size:17px;font-weight:700;letter-spacing:-.01em;margin:0}
.field{margin-top:var(--s4)}.field>label,.lab{display:block;font-size:13.5px;font-weight:600;margin-bottom:6px}
input,select{width:100%;min-height:42px;padding:8px 11px;border:1px solid var(--line2);border-radius:8px;font:inherit;background:#fff;color:var(--ink);transition:border-color .15s}input:hover,select:hover{border-color:#a9a79b}input::placeholder{color:#6d746e}
.help{font-size:12.5px;color:var(--mute);margin:5px 0 0;min-height:1em}.help:empty{display:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{min-height:36px;padding:5px 11px;font-size:13.5px;border-radius:999px;border:1px solid var(--line2);background:#fff;color:var(--ink)}.chip:hover{border-color:var(--brand2)}.chip[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
button{font:inherit;cursor:pointer;color:var(--brand);background:none;border:0;border-radius:8px;transition:background-color .15s,border-color .15s,color .15s}button:disabled{cursor:progress;opacity:.65}
.go{width:100%;min-height:46px;margin-top:20px;background:var(--brand);color:#fff;font-weight:650}.go:hover{background:var(--brand2)}
.fine{font-size:12.5px;line-height:1.5;color:var(--mute);margin:var(--s3) 0 0}
.summary{display:flex;align-items:center;gap:var(--s4);flex-wrap:wrap;margin:2px 0 var(--s4);min-height:32px}.tally{display:flex;gap:var(--s4);flex-wrap:wrap}.tally span{display:inline-flex;align-items:baseline;gap:5px;font-size:14px;color:var(--mute)}.tally b{font-size:22px;font-weight:700;letter-spacing:-.02em}.tally .t-일치 b{color:var(--ok)}.tally .t-확인 b{color:var(--ask)}.tally .t-불일치 b{color:var(--no)}
.toggle{display:inline-flex;gap:7px;align-items:center;font-size:13.5px;color:var(--mute);margin-left:auto;cursor:pointer;min-height:32px}.toggle input{width:17px;min-height:17px;height:17px;accent-color:var(--brand)}.busy{font-size:13.5px;color:var(--mute)}
.common{background:var(--askbg);border:1px solid var(--askline);border-radius:12px;padding:18px 20px 8px;margin-bottom:var(--s4)}.common p.sub{font-size:13.5px;color:#65502a;margin:3px 0 10px}
.q{display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:var(--s4);align-items:center;padding:11px 0;border-top:1px solid var(--askline)}.q .qt{font-size:15px;line-height:1.45}.q .cnt{display:block;color:#65502a;font-size:12.5px;margin-top:2px}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:6px}.yn button{min-height:40px;border:1px solid #d3c294;background:#fff;color:var(--ink);font-weight:550}.yn button:hover{border-color:var(--ask);background:#fffaf0}
.more{padding:10px 0 12px;border-top:1px solid var(--askline)}.link{min-height:36px;padding:5px 9px;margin-left:-9px;color:var(--brand);font-weight:600;font-size:14px}.link:hover{background:var(--brandbg)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:var(--s3)}
.top{display:flex;justify-content:space-between;gap:var(--s4);align-items:flex-start}.card h3{margin:0;font-size:17px;font-weight:650;line-height:1.4;letter-spacing:-.012em;text-wrap:pretty}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px 4px 8px;border-radius:999px;font-weight:650;font-size:13.5px;white-space:nowrap}.small{padding:2px 8px;font-size:12.5px;font-weight:600}
.s-일치{color:var(--ok);background:var(--okbg)}.s-확인{color:var(--ask);background:var(--askbg)}.s-불일치{color:var(--no);background:var(--nobg)}.s-기관{color:var(--org);background:var(--orgbg)}
.meta{display:flex;gap:5px 12px;flex-wrap:wrap;font-size:13.5px;color:var(--mute);margin-top:6px;align-items:center}.meta .tag-org{color:var(--org);font-weight:600}.meta .when{color:var(--ink);font-weight:550}
.need{font-size:14px;color:var(--ask);margin:10px 0 0}.need.no{color:var(--no)}
.actions{display:flex;gap:4px 6px;flex-wrap:wrap;margin-top:var(--s3);margin-left:-9px;align-items:center}.actions a{text-decoration:none}.act{display:inline-flex;align-items:center;min-height:36px;padding:5px 9px;font-size:14px;font-weight:550;color:var(--mute)}.act:hover{background:#f1f0ea;color:var(--ink)}.act.first{color:var(--brand);font-weight:650;margin-left:0}.act.first:hover{background:var(--brandbg);color:var(--brand)}
.changed{animation:flash 1.6s cubic-bezier(.16,1,.3,1)}@keyframes flash{from{background:#fbeec8;border-color:#e0c26b}to{background:var(--paper);border-color:var(--line)}}.was{color:var(--ink);font-weight:600}
table{width:100%;border-collapse:collapse;font-size:14px;margin-top:var(--s3)}td{padding:10px 8px 10px 0;border-top:1px solid var(--line);vertical-align:top}td:first-child{width:92px}.why{color:var(--mute);font-size:13px}blockquote{margin:4px 0 0;padding-left:9px;border-left:2px solid var(--line2);color:var(--mute);font-size:13px}
.cardbox{background:#f8f7f2;border-radius:10px;padding:14px 16px;margin-top:var(--s3);font-size:15px}.cardbox b{display:block}.cardbox p{margin:6px 0 10px;max-width:70ch}.cardbox ul{margin:4px 0 12px;padding-left:20px}.cardbox .fine{margin:0}.err{color:var(--no);font-size:14px;margin:10px 0 0}
.trace{list-style:none;margin:var(--s3) 0 0;padding:12px 14px;background:#f3f4f2;border-radius:10px;font-size:13.5px}.trace li{display:grid;grid-template-columns:190px minmax(0,1fr);gap:var(--s3);padding:3px 0}.trace b{font-weight:600}
.empty{background:var(--paper);border:1px dashed var(--line2);border-radius:12px;padding:var(--s6) var(--s5);color:var(--mute)}.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
@media(max-width:860px){main{grid-template-columns:minmax(0,1fr);padding:var(--s4);gap:var(--s4)}aside{position:static}header div{padding:16px}.q{grid-template-columns:minmax(0,1fr);gap:var(--s2)}.top{flex-direction:column-reverse;gap:var(--s2)}.toggle{margin-left:0}.trace li{grid-template-columns:minmax(0,1fr);gap:0;padding:5px 0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<header><div><h1>사장님 공고 확인</h1><p>공고 원문의 조건과 우리 가게 정보를 대조하고, 근거 문구를 함께 보여드립니다. 정보 제공용이며 최종 자격은 주관기관이 판단합니다.</p></div></header>
<main>
<aside aria-label="우리 가게 정보"><h2>우리 가게 정보</h2>
<div class="field"><span class="lab">예시 불러오기</span><div class="chips" id="preset"><button class="chip" data-p="food" aria-pressed="false">식품 제조(보은군, 4명)</button><button class="chip" data-p="rest" aria-pressed="false">한식 음식점(3명)</button><button class="chip" data-p="shop" aria-pressed="false">의류 소매(3명)</button></div></div>
<div class="field"><label for="as_of">기준일</label><input id="as_of" type="date"></div>
<div class="field"><label for="main_industry_ksic">주된 업종 코드(5자리)</label><input id="main_industry_ksic" inputmode="numeric" maxlength="5" placeholder="예: 56111"><p class="help">사업자등록증의 업종코드</p></div>
<div class="field"><label for="employees">상시근로자 수</label><input id="employees" type="number" min="0" inputmode="numeric"></div>
<div class="field"><label for="revenue_3y_avg">최근 3년 평균 매출(원)</label><input id="revenue_3y_avg" type="number" min="0" inputmode="numeric"><p class="help" id="revenue_3y_avg_h"></p></div>
<div class="field"><label for="revenue_2025">2025년 매출(원)</label><input id="revenue_2025" type="number" min="0" inputmode="numeric"><p class="help" id="revenue_2025_h"></p></div>
<div class="field"><label for="founded_date">개업일</label><input id="founded_date" type="date"></div>
<div class="field"><label for="business_status">영업 상태</label><select id="business_status"><option value="">선택</option><option>정상</option><option>휴업</option><option>폐업</option></select></div>
<button class="go" id="go" onclick="run()">공고 대조하기</button>
<p class="fine">입력값은 이 화면의 판정에만 씁니다. 가게 이름이나 주민번호는 받지 않습니다.</p></aside>
<section aria-live="polite"><div class="summary" id="summary"></div><div id="common"></div><div id="list"><div class="empty"><b>왼쪽에 정보를 넣어 주세요</b>공고별 대조 결과가 여기에 나타납니다. 값이 없으면 필요한 항목만 다시 여쭙니다.</div></div></section>
</main>
<script>
const $=id=>document.getElementById(id);let profile={},prev={},showClosed=false,moreQ=false,seq=0,refocus=false;const opened=new Set();
const P={food:{main_industry_ksic:'10799',employees:4,revenue_3y_avg:300000000,revenue_2025:300000000,founded_date:'2020-03-02',business_status:'정상',hq_region:'보은군',factory_region:'보은군',site_region:'보은군',applicant_type:'기존 기업'},rest:{main_industry_ksic:'56111',employees:3,revenue_3y_avg:400000000,revenue_2025:90000000,founded_date:'2021-01-04',business_status:'정상',revenue_compare_period:'연도',revenue_before:100000000,revenue_latest:80000000},shop:{main_industry_ksic:'47411',employees:3,revenue_3y_avg:500000000,revenue_2025:80000000,founded_date:'2019-05-10',business_status:'정상'}};
const COMMON={tax_arrears:false,social_insurance_arrears:false,debt_default:false,gov_sanction:false};Object.values(P).forEach(p=>Object.assign(p,COMMON));
const FORM=['main_industry_ksic','employees','revenue_3y_avg','revenue_2025','founded_date','business_status'];
const ICON={일치:'<path d="m3.5 8.5 3 3 6-7"/>','확인':'<path d="M8 4v5"/><path d="M8 12h.01"/>',불일치:'<path d="m4.5 4.5 7 7"/><path d="m11.5 4.5-7 7"/>'};
const icon=c=>`<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[c]||''}</svg>`;
const cls=s=>s==='확인 필요'?'확인':s;const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const post=(u,b)=>fetch(u,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()});
// 금액을 읽기 쉬운 단위로 함께 보여준다.
function won(v){v=Number(v);if(!v)return '';const e=Math.floor(v/1e8),m=Math.round(v%1e8/1e4);return (e?e+'억 ':'')+(m?m.toLocaleString()+'만 ':'')+'원'}
function hints(){['revenue_3y_avg','revenue_2025'].forEach(k=>$(k+'_h').textContent=won($(k).value))}['revenue_3y_avg','revenue_2025'].forEach(k=>$(k).addEventListener('input',hints));
$('as_of').value=new Date().toISOString().slice(0,10);
function pick(k){const v=P[k];if(!v)return;profile={...v};FORM.forEach(f=>$(f).value=v[f]??'');[...document.querySelectorAll('.chip')].forEach(b=>b.setAttribute('aria-pressed',b.dataset.p===k));hints();prev={};run()}
$('preset').onclick=e=>{const b=e.target.closest('.chip');if(b)pick(b.dataset.p)};
function read(){FORM.forEach(k=>{const raw=$(k).value;if(raw==='')delete profile[k];else profile[k]=($(k).type==='number')?Number(raw):raw})}
// 공고상 마감일까지 남은 날짜를 계산한다. 기간 내 공고에만 표시한다.
function when(x,asOf){const end=Array.isArray(x.period_value)&&x.period_value[1];if(!end||x.period!=='공고상 기간 내')return esc(x.period);const d=Math.round((new Date(end.slice(0,10))-new Date(asOf))/864e5);return `<span class="when">공고상 마감 ${Number(end.slice(5,7))}월 ${Number(end.slice(8,10))}일</span> (${d===0?'오늘':d+'일 남음'})`}
async function run(){const my=++seq;read();$('go').disabled=true;$('go').textContent='대조 중';let r;const asOf=$('as_of').value;
try{r=await post('/api/judge',{profile,as_of:asOf})}catch(e){if(my===seq){$('list').innerHTML='<div class="empty"><b>결과를 불러오지 못했습니다</b>서버 연결을 확인한 뒤 공고 대조하기를 다시 눌러 주세요.</div>';$('common').innerHTML='';$('summary').innerHTML='';$('go').disabled=false;$('go').textContent='공고 대조하기'}return}
if(my!==seq)return;const closed=r.results.filter(x=>x.period==='마감').length;r.results=r.results.filter(x=>showClosed||x.period!=='마감');
const c={일치:0,'확인 필요':0,불일치:0};r.results.forEach(x=>c[x.status]++);
// 같은 질문은 한 번만 묻고, 영향받는 공고가 많은 질문부터 보여준다. 이미 불일치인 공고 때문에는 묻지 않는다.
const cnt={},meta={};r.results.filter(x=>x.status!=='불일치').forEach(x=>x.ask.forEach(a=>{cnt[a.field]=(cnt[a.field]||0)+1;meta[a.field]=a}));const allF=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]);const fields=moreQ?allF:allF.slice(0,5);
let q={};if(fields.length){try{q=await post('/api/questions',{fields})}catch(e){q={}}if(my!==seq)return}
$('summary').innerHTML=`<div class="tally"><span class="t-일치"><b>${c['일치']}</b>공고 조건 일치</span><span class="t-확인"><b>${c['확인 필요']}</b>확인 필요</span><span class="t-불일치"><b>${c['불일치']}</b>불일치</span></div><label class="toggle"><input type="checkbox" ${showClosed?'checked':''} onchange="showClosed=this.checked;run()">마감 공고 ${closed}건도 보기</label>`;
$('common').innerHTML=allF.length?`<div class="common"><h2>몇 가지만 여쭙겠습니다</h2><p class="sub">한 번 답하면 모든 공고에 반영됩니다. 답을 모르면 비워 두셔도 됩니다.</p>${fields.map(f=>ask(meta[f],q[f],cnt[f])).join('')}${allF.length>5?`<div class="more"><button class="link" onclick="moreQ=!moreQ;run()">${moreQ?'접기':`나머지 ${allF.length-5}개 더 보기`}</button></div>`:''}</div>`:'';
const now={};$('list').innerHTML=r.results.length?r.results.map((x,i)=>{const key=x.id+(x.program||'');now[key]=x.status;const ch=prev[key]&&prev[key]!==x.status;const k=cls(x.status);
return `<article class="card ${ch?'changed':''}"><div class="top"><h3>${esc(x.title)}${x.program?' · '+esc(x.program):''}</h3><span class="pill s-${k}">${icon(k)}공고 조건 ${esc(x.status)}</span></div><div class="meta"><span>${when(x,asOf)}</span>${x.flags.includes('기관 판단 표시')?'<span class="tag-org">기관 판단 항목 있음</span>':''}${x.flags.includes('조기 마감 가능 표시')?'<span>예산 소진 시 조기 마감 가능</span>':''}${x.flags.includes('일정 표기 불일치 표시')?'<span>공고 일정 표기 불일치</span>':''}${x.flags.includes('근거 충돌 표시')?'<span>공고 조건 표기 충돌</span>':''}${ch?`<span class="was">변경: ${esc(prev[key])} → ${esc(x.status)}</span>`:''}</div>
${x.status==='불일치'?`<p class="need no">공고와 다른 조건: ${x.conditions.filter(k=>x.deciding.includes(k.id)).slice(0,3).map(k=>esc(k.label)).join(', ')}</p>`:x.ask.length?`<p class="need">이 공고에 필요한 답 ${x.ask.length}개: ${x.ask.slice(0,3).map(a=>esc(a.label)).join(', ')}${x.ask.length>3?' 등':''}</p>`:''}
<div class="actions"><button class="act first" aria-expanded="${opened.has(key)}" onclick="tog('${esc(key)}','d${i}',this)">조건·근거 보기</button><button class="act first" onclick="card(${i},this)">안내 받기</button>${x.url?`<a class="act" href="${esc(x.url)}" target="_blank" rel="noopener">공고 원문</a>`:''}${Array.isArray(x.period_value)&&x.period_value[1]?`<a class="act" href="/api/ics/${x.id}">달력에 마감일 추가</a>`:''}<button class="act" onclick="trace('${x.id}',${i},this)">에이전트 작업 기록</button></div>
<div id="c${i}"></div><div id="d${i}" ${opened.has(key)?'':'hidden'}><table>${x.conditions.map(k=>`<tr><td><span class="pill small s-${cls(k.status).split(' ')[0]}">${esc(k.status)}</span></td><td>${esc(k.label)} <span class="why">(${esc(k.why)})</span>${k.quote?`<blockquote>${k.page}쪽 “${esc(k.quote)}”</blockquote>`:''}</td></tr>`).join('')}</table></div><div id="t${i}"></div></article>`}).join(''):'<div class="empty"><b>기간 내 공고가 없습니다</b>마감 공고도 보려면 위의 선택 칸을 눌러 주세요.</div>';
window.R=r.results;prev=now;$('go').disabled=false;$('go').textContent='공고 대조하기';if(refocus){refocus=false;const f=document.querySelector('#common button,#common input,#common select');if(f)f.focus({preventScroll:true})}}

function summ(t){const r=t.result||{};if(t.tool==='extract')return `조건 ${r.n_conditions}개 (${r.extract_round}회차)`;if(t.tool==='validate')return `SHACL ${r.shacl_ok?'통과':'위반'}, 인용 오류 ${(r.quote_errors||[]).length}건, 판정 불가 ${(r.lint_errors||[]).length}건`;if(t.tool==='verify')return ((r.issues||[]).length?`지적 ${(r.issues||[]).length}건: ${(r.issues[0].detail||'').slice(0,90)}…`:'지적 없음')+(r.dropped_without_source?` (원문 근거 없는 지적 ${r.dropped_without_source}건 제외)`:'');if(t.tool==='finalize')return (r.unresolved||[]).length?`미해결 ${r.unresolved.length}건`:'미해결 없음';return ''}
