<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>사장님 공고 확인</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--bg:#f6f5f1;--paper:#fff;--ink:#1f2421;--mute:#667067;--line:#dfddd4;--ok:#1a6b45;--okbg:#e6f2ea;--ask:#8a5a00;--askbg:#fbf1da;--no:#9a3324;--nobg:#f8e7e3;--brand:#21443a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Pretendard Variable",system-ui,sans-serif}
header{background:var(--brand);color:#fff;padding:18px 24px}header h1{margin:0;font-size:21px}header p{margin:3px 0 0;font-size:14px;opacity:.85}
main{display:grid;grid-template-columns:340px 1fr;gap:18px;padding:18px 24px;max-width:1240px;margin:auto}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:16px}
aside{align-self:start;position:sticky;top:12px}aside h2,section h2{font-size:16px;margin:0 0 10px}
label{display:block;font-size:13px;font-weight:600;margin:10px 0 3px}input,select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;font:inherit;background:#fff}
.help{font-size:12px;color:var(--mute);margin:2px 0 0}button{font:inherit;cursor:pointer;border-radius:6px;border:1px solid var(--brand);padding:7px 12px;background:#fff;color:var(--brand)}button.main{background:var(--brand);color:#fff;width:100%;margin-top:14px;padding:10px;font-weight:600}
.tally{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}.tally span{padding:6px 11px;border-radius:999px;font-size:14px;font-weight:600}
.s-일치{color:var(--ok);background:var(--okbg)}.s-확인{color:var(--ask);background:var(--askbg)}.s-불일치{color:var(--no);background:var(--nobg)}.s-기관{color:#3f4a6b;background:#e9ecf4}
.card{background:var(--paper);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:11px}.card.일치{border-left-color:var(--ok)}.card.확인{border-left-color:#d9a21b}.card.불일치{border-left-color:var(--no)}
.card h3{margin:0 0 5px;font-size:16px}.meta{display:flex;gap:7px;flex-wrap:wrap;font-size:13px;align-items:center;margin-bottom:6px}.pill{padding:2px 8px;border-radius:999px;font-weight:600;font-size:13px}.changed{outline:2px solid #d9a21b}
.gray{color:var(--mute)}table{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:8px}td,th{padding:6px 5px;border-top:1px solid var(--line);text-align:left;vertical-align:top}blockquote{margin:2px 0 0;padding-left:7px;border-left:2px solid var(--line);color:var(--mute);font-size:12.5px}
.ask{background:var(--askbg);border-radius:8px;padding:10px 12px;margin-top:8px}.ask label{font-weight:500;font-size:14px}.row{display:flex;gap:6px;align-items:center}.row input{flex:1}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.notice{font-size:12.5px;color:var(--mute);margin-top:10px}.cardbox{background:#f9f8f4;border-radius:8px;padding:10px 12px;margin-top:8px;font-size:14.5px}.trace{font-size:12.5px;margin-top:8px;background:#f4f5f7;padding:8px 10px;border-radius:6px;white-space:pre-wrap;word-break:break-word}
@media(max-width:820px){main{grid-template-columns:1fr;padding:12px 16px}aside{position:static}}
</style></head><body>
<header><h1>사장님 공고 확인</h1><p>공고 원문의 조건과 우리 가게 정보를 대조하고, 근거 문구를 함께 보여드립니다. 정보 제공용이며 최종 자격은 주관기관이 판단합니다.</p></header>
<main>
<aside class="panel"><h2>우리 가게 정보</h2>
<label>예시 불러오기</label><select id="preset"><option value="">직접 입력</option><option value="food">식품 제조(보은군, 4명)</option><option value="rest">한식 음식점(3명)</option><option value="shop">의류 소매(3명)</option></select>
<label>기준일</label><input id="as_of" type="date">
<label>주된 업종 코드(5자리)</label><input id="main_industry_ksic" placeholder="예: 56111"><p class="help">사업자등록증의 업종코드</p>
<label>상시근로자 수</label><input id="employees" type="number" min="0">
<label>최근 3년 평균 매출(원)</label><input id="revenue_3y_avg" type="number" min="0">
<label>2025년 매출(원)</label><input id="revenue_2025" type="number" min="0">
<label>개업일</label><input id="founded_date" type="date">
<label>영업 상태</label><select id="business_status"><option value="">선택</option><option>정상</option><option>휴업</option><option>폐업</option></select>
<button class="main" onclick="run()">공고 대조하기</button>
<p class="notice">입력값은 이 화면의 판정에만 씁니다. 가게 이름이나 주민번호는 받지 않습니다.</p></aside>
<section><div class="tally" id="tally"></div><div id="list"><div class="panel gray">왼쪽에 정보를 넣으면 공고별 대조 결과가 나타납니다. 값이 없으면 필요한 항목만 다시 여쭙니다.</div></div></section>
</main>
<script>
const $=id=>document.getElementById(id);let profile={},prev={};const money=v=>Number(v);
const P={food:{main_industry_ksic:'10799',employees:4,revenue_3y_avg:300000000,revenue_2025:300000000,founded_date:'2020-03-02',business_status:'정상',hq_region:'보은군',factory_region:'보은군',site_region:'보은군',applicant_type:'기존 기업'},rest:{main_industry_ksic:'56111',employees:3,revenue_3y_avg:400000000,revenue_2025:90000000,founded_date:'2021-01-04',business_status:'정상'},shop:{main_industry_ksic:'47411',employees:3,revenue_3y_avg:500000000,revenue_2025:80000000,founded_date:'2019-05-10',business_status:'정상'}};
const FORM=['main_industry_ksic','employees','revenue_3y_avg','revenue_2025','founded_date','business_status'];
$('as_of').value=new Date().toISOString().slice(0,10);
$('preset').onchange=e=>{const v=P[e.target.value];if(!v)return;profile={...v};FORM.forEach(k=>$(k).value=v[k]??'');run()};
function read(){FORM.forEach(k=>{const raw=$(k).value;if(raw==='')delete profile[k];else profile[k]=($(k).type==='number')?Number(raw):raw})}
const cls=s=>s==='확인 필요'?'확인':s;const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function run(){read();const r=await fetch('/api/judge',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({profile,as_of:$('as_of').value})}).then(r=>r.json());
const c={일치:0,'확인 필요':0,불일치:0};r.results.forEach(x=>c[x.status]++);
$('tally').innerHTML=`<span class="s-일치">공고 조건 일치 ${c['일치']}</span><span class="s-확인">확인 필요 ${c['확인 필요']}</span><span class="s-불일치">불일치 ${c['불일치']}</span>`;
const fields=[...new Set(r.results.flatMap(x=>x.ask.map(a=>a.field)))];const q=fields.length?await fetch('/api/questions',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({fields})}).then(r=>r.json()):{};
const now={};$('list').innerHTML=r.results.map((x,i)=>{const key=x.id+(x.program||'');now[key]=x.status;const ch=prev[key]&&prev[key]!==x.status;
return `<article class="card ${cls(x.status)} ${ch?'changed':''}"><h3>${esc(x.title)}${x.program?' · '+esc(x.program):''}</h3><div class="meta"><span class="pill s-${cls(x.status)}">공고 조건 ${x.status==='확인 필요'?'확인 필요':x.status}</span><span class="gray">${esc(x.period)}</span>${x.flags.includes('기관 판단 표시')?'<span class="pill s-기관">기관 판단 항목 있음</span>':''}${x.flags.includes('조기 마감 가능 표시')?'<span class="gray">예산 소진 시 조기 마감 가능</span>':''}${x.flags.includes('일정 표기 불일치 표시')?'<span class="gray">공고 일정 표기 불일치</span>':''}${x.flags.includes('근거 충돌 표시')?'<span class="gray">공고 조건 표기 충돌</span>':''}${ch?`<span class="gray">변경: ${esc(prev[key])} → ${esc(x.status)}</span>`:''}</div>
${x.ask.length?`<div class="ask">${x.ask.slice(0,4).map(a=>ask(a,q[a.field])).join('')}</div>`:''}
<div class="actions"><button onclick="tog('d${i}')">조건·근거 보기</button><button onclick="card(${i},this)">안내 받기</button>${x.url?`<a href="${esc(x.url)}" target="_blank" rel="noopener"><button>공고 원문</button></a>`:''}${Array.isArray(x.period_value)&&x.period_value[1]?`<a href="/api/ics/${x.id}"><button>달력에 마감일 추가</button></a>`:''}<button onclick="trace('${x.id}',${i})">에이전트 작업 기록</button></div>
<div id="c${i}"></div><div id="d${i}" hidden><table><tr><th>상태</th><th>조건·근거</th></tr>${x.conditions.map(k=>`<tr><td><span class="pill s-${cls(k.status).split(' ')[0]}">${esc(k.status)}</span></td><td>${esc(k.label)} <span class="gray">(${esc(k.why)})</span><blockquote>${k.page}쪽 “${esc(k.quote)}”</blockquote></td></tr>`).join('')}</table></div><div id="t${i}"></div></article>`}).join('');window.R=r.results;prev=now}
function ask(a,q){const i=a.kind==='bool'?`<select onchange="ans('${a.field}',this.value==='예'?true:this.value==='아니오'?false:null)"><option value="">선택</option><option>예</option><option>아니오</option></select>`:`<div class="row"><input type="${a.kind==='text'?'text':a.kind}" onchange="ans('${a.field}',this.value,'${a.kind}')"></div>`;return `<label>${esc(q||a.label)}</label>${i}`}
function ans(f,v,k){if(v===null||v==='')delete profile[f];else profile[f]=k==='number'?Number(v):v;if(FORM.includes(f))$(f).value=v;run()}
const tog=id=>{$(id).hidden=!$(id).hidden};
async function card(i,b){b.disabled=true;b.textContent='작성 중';const x=R[i];const r=await fetch('/api/card',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id:x.id,program:x.program,profile,as_of:$('as_of').value})}).then(r=>r.json());const c=r.card;$('c'+i).innerHTML=`<div class="cardbox"><b>${esc(c.headline)}</b><p>${esc(c.summary)}</p>${c.todo.length?'<b>할 일</b><ul>'+c.todo.map(t=>`<li>${esc(t)}</li>`).join('')+'</ul>':''}${c.check_items.length?'<b>확인할 것</b><ul>'+c.check_items.map(t=>`<li>${esc(t)}</li>`).join('')+'</ul>':''}<p class="notice">${esc(c.notice)}</p></div>`;b.disabled=false;b.textContent='안내 받기'}
async function trace(id,i){const r=await fetch('/api/trace/'+id).then(r=>r.json());$('t'+i).innerHTML=`<div class="trace">${r.map((t,k)=>`${k+1}. ${esc({extract:'문서 해석',validate:'SHACL·인용 검사',verify:'근거 검증',finalize:'총괄 확정'}[t.tool]||t.tool)}: ${esc(summ(t))}`).join('\n')}</div>`}
function summ(t){const r=t.result||{};if(t.tool==='extract')return `조건 ${r.n_conditions}개 (${r.extract_round}회차)`;if(t.tool==='validate')return `SHACL ${r.shacl_ok?'통과':'위반'}, 인용 오류 ${(r.quote_errors||[]).length}건`;if(t.tool==='verify')return (r.issues||[]).length?`지적 ${(r.issues||[]).length}건: ${(r.issues[0].detail||'').slice(0,90)}…`:'지적 없음';if(t.tool==='finalize')return (r.unresolved||[]).length?`미해결 ${r.unresolved.length}건`:'미해결 없음';return ''}
</script></body></html>
