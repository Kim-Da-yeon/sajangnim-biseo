<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>사장님 공고 확인</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3.6' fill='%231d1d1f'/%3E%3Cpath d='m4 8.5 2.5 2.5 5.5-6' fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{color-scheme:light dark;--bg:#f5f5f7;--group:#fff;--ink:#1d1d1f;--mute:#6e6e73;--faint:#86868b;--sep:rgba(60,60,67,.16);--fill:rgba(120,120,128,.12);--fill2:rgba(120,120,128,.2);--thumb:#fff;--blue:#0066cc;--bluebg:rgba(0,102,204,.1);--ok:#1b7f3b;--ask:#a85a00;--no:#c9281d;--org:#4b4fb5;--bar:rgba(245,245,247,.72);--flash:rgba(255,159,10,.16);--press:rgba(120,120,128,.14);--drawer:cubic-bezier(.32,.72,0,1)}
@media(prefers-color-scheme:dark){:root{--bg:#000;--group:#1c1c1e;--ink:#f5f5f7;--mute:#a1a1a6;--faint:#8e8e93;--sep:rgba(84,84,88,.6);--fill:rgba(118,118,128,.24);--fill2:rgba(118,118,128,.36);--thumb:#636366;--blue:#4da3ff;--bluebg:rgba(77,163,255,.16);--ok:#32d74b;--ask:#ffb340;--no:#ff6961;--org:#a5a8ff;--bar:rgba(22,22,23,.72);--flash:rgba(255,159,10,.2);--press:rgba(118,118,128,.28)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{scrollbar-color:var(--fill2) transparent;-webkit-text-size-adjust:100%}::selection{background:var(--bluebg)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.47 "Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo",system-ui,sans-serif;font-variant-numeric:tabular-nums;word-break:keep-all;overflow-wrap:anywhere;-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}svg{flex:none;display:block}a{color:var(--blue);text-decoration:none}button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.bar{position:sticky;top:0;z-index:5;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 .5px 0 var(--sep)}.bar div{max-width:1120px;margin:auto;padding:11px 24px;display:flex;align-items:center;gap:16px;min-height:48px}.bar b{font-size:.94rem;font-weight:600;letter-spacing:-.01em}#tally{margin-left:auto;font-size:.81rem;color:var(--mute);display:flex;gap:12px}#tally i{font-style:normal;font-weight:600;margin-right:3px}.t-ok i{color:var(--ok)}.t-ask i{color:var(--ask)}.t-no i{color:var(--no)}
.head{max-width:1120px;margin:auto;padding:36px 24px 4px}h1{margin:0;font-size:2rem;line-height:1.12;font-weight:700;letter-spacing:-.026em}.head p{margin:8px 0 0;max-width:42em;color:var(--mute);font-size:.97rem}
main{display:grid;grid-template-columns:330px minmax(0,1fr);gap:32px;padding:20px 24px 72px;max-width:1120px;margin:auto;align-items:start}aside{position:sticky;top:64px}
.cap{display:flex;align-items:baseline;gap:6px;margin:0 0 7px 16px;font-size:.81rem;font-weight:500;color:var(--mute)}.cap b{font-size:1.06rem;font-weight:650;letter-spacing:-.012em;color:var(--ink)}.foot{margin:7px 16px 22px;font-size:.78rem;line-height:1.42;color:var(--mute)}
.group{background:var(--group);border-radius:12px;overflow:hidden}.line{display:flex;align-items:center;gap:12px;min-height:46px;padding:7px 16px;position:relative;font-size:.94rem}.group>*+*::before,.d-list>*+*::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}.group>*,.d-list>*{position:relative}
.line>span{flex:1;min-width:0}.line small{display:block;font-size:.76rem;color:var(--mute);line-height:1.25}.line small:empty{display:none}.line input,.line select{flex:0 0 46%;width:46%;min-width:0;border:0;background:none;color:var(--ink);font:inherit;text-align:right;padding:4px 0;min-height:32px;border-radius:6px}.line select{text-align-last:right;appearance:none;-webkit-appearance:none;cursor:pointer;color:var(--blue)}input[type=number]{-moz-appearance:textfield;appearance:textfield}input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}.line input::placeholder{color:var(--faint)}.line input[type=date]{min-width:128px}.line input:focus{outline:0;color:var(--blue)}
.seg{position:relative;display:grid;grid-template-columns:repeat(3,1fr);background:var(--fill);border-radius:9px;padding:2px;margin-bottom:20px}.seg button{position:relative;z-index:1;min-height:34px;font-size:.81rem;font-weight:500;border-radius:7px;transition:transform .1s ease-out}.seg button[aria-pressed=true]{font-weight:600}.thumb{position:absolute;top:2px;bottom:2px;left:2px;width:calc((100% - 4px)/3);background:var(--thumb);border-radius:7px;box-shadow:0 1px 2px rgba(0,0,0,.14),0 0 0 .5px rgba(0,0,0,.05);opacity:0;transition:transform .28s var(--drawer),opacity .15s}
.go{display:block;width:100%;min-height:46px;margin-top:14px;border-radius:12px;background:var(--blue);color:#fff;font-weight:600;font-size:.97rem;transition:transform .1s ease-out,opacity .15s}@media(prefers-color-scheme:dark){.go{color:#001b36}}.go:active,.seg button:active,.yn button:active,.act:active{transform:scale(.97)}.go:disabled{opacity:.55;cursor:progress}
.q{display:grid;grid-template-columns:minmax(0,1fr) 148px;gap:16px;align-items:center;padding:11px 16px}.qt{font-size:.94rem;line-height:1.38}.qt small{display:block;margin-top:2px;font-size:.76rem;color:var(--mute)}.q input,.q select{width:100%;min-height:34px;border:0;border-radius:8px;background:var(--fill);color:var(--ink);font:inherit;font-size:.88rem;padding:5px 10px}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--fill);border-radius:9px;padding:2px}.yn button{min-height:30px;border-radius:7px;font-size:.84rem;font-weight:500;transition:transform .1s ease-out}.more{display:block;width:100%;text-align:left;padding:12px 16px;min-height:44px;color:var(--blue);font-size:.94rem}
.sec{margin-top:26px}.sec:first-child{margin-top:0}.row{display:flex;gap:12px;width:100%;text-align:left;padding:13px 16px;align-items:flex-start;transition:background-color .12s}.row:active{background:var(--press)}.mark{margin-top:2px}.mark.ok{color:var(--ok)}.mark.ask{color:var(--ask)}.mark.no{color:var(--no)}.row .t{flex:1;min-width:0}.row h3{margin:0;font-size:.97rem;line-height:1.36;font-weight:600;letter-spacing:-.008em;text-wrap:pretty}.sub{display:block;margin-top:2px;font-size:.81rem;color:var(--mute);line-height:1.4}.sub em{font-style:normal;color:var(--org)}.sub strong{font-weight:500;color:var(--ink)}.need{display:block;margin-top:3px;font-size:.81rem;color:var(--ask);line-height:1.4}.need.no{color:var(--no)}
.chev{margin-top:4px;color:var(--faint);transition:transform .24s var(--drawer)}[aria-expanded=true] .chev{transform:rotate(90deg)}
.drawer{display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s var(--drawer)}.drawer.on{grid-template-rows:1fr}.drawer>div{overflow:hidden;min-height:0}.inner{padding:0 16px 14px 44px}
.acts{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;padding:2px 0 8px}.act{display:inline-flex;align-items:center;min-height:32px;font-size:.88rem;color:var(--blue);border-radius:6px;transition:transform .1s ease-out}.act.main{background:var(--bluebg);padding:4px 13px;border-radius:999px;font-weight:600}.act:disabled{opacity:.55;cursor:progress}
.d-list{list-style:none;margin:0;padding:0}.d{display:grid;grid-template-columns:62px minmax(0,1fr);gap:10px;padding:9px 0;font-size:.875rem;line-height:1.42}.d-list>.d+.d::before{left:0}.st{font-size:.78rem;font-weight:600;padding-top:1px}.st.ok{color:var(--ok)}.st.ask{color:var(--ask)}.st.no{color:var(--no)}.st.org{color:var(--org)}.why{color:var(--mute);font-size:.8rem}.src{display:block;margin-top:3px;color:var(--mute);font-size:.8rem}
.guide{background:var(--fill);border-radius:10px;padding:12px 14px;margin:2px 0 10px;font-size:.91rem}.guide b{display:block;font-weight:600}.guide p{margin:5px 0 8px}.guide ul{margin:3px 0 10px;padding-left:18px}.guide .foot{margin:0}.err{color:var(--no);font-size:.875rem;margin:4px 0 8px}
.log{list-style:none;margin:8px 0 2px;padding:10px 12px;background:var(--fill);border-radius:10px;font-size:.81rem}.log li{display:grid;grid-template-columns:150px minmax(0,1fr);gap:10px;padding:2px 0}.log b{font-weight:600}
.empty{padding:44px 24px;text-align:center;color:var(--mute);background:var(--group);border-radius:12px;font-size:.94rem}.empty b{display:block;color:var(--ink);font-size:1.06rem;font-weight:600;margin-bottom:3px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:.88rem;color:var(--mute);margin:22px 16px 0;cursor:pointer}.toggle input{appearance:none;-webkit-appearance:none;position:relative;width:40px;height:24px;margin:0;border-radius:12px;background:var(--fill2);cursor:pointer;transition:background-color .2s;flex:none}.toggle input::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .24s var(--drawer)}.toggle input:checked{background:var(--ok)}.toggle input:checked::after{transform:translateX(16px)}
.changed{animation:flash 1.4s cubic-bezier(.23,1,.32,1)}@keyframes flash{from{background:var(--flash)}to{background:transparent}}.was{color:var(--ink);font-weight:500}
@media(hover:hover) and (pointer:fine){.row:hover{background:var(--press)}.act:hover{opacity:.72}.seg button:hover{color:var(--blue)}.yn button:hover{background:var(--thumb)}}
@media(max-width:860px){main{grid-template-columns:minmax(0,1fr);gap:26px;padding:14px 16px calc(48px + env(safe-area-inset-bottom))}aside{position:static}.head{padding:22px 16px 2px}h1{font-size:1.75rem}.bar div{padding:9px 16px}.q{grid-template-columns:minmax(0,1fr);gap:8px}.inner{padding:0 14px 14px 14px}.log li{grid-template-columns:minmax(0,1fr);gap:0;padding:4px 0}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}}
@media(prefers-reduced-transparency:reduce){.bar{background:var(--bg);-webkit-backdrop-filter:none;backdrop-filter:none}}
@media(prefers-contrast:more){:root{--sep:rgba(60,60,67,.6);--mute:#3a3a3c}}
</style></head><body>
<div class="bar"><div><b>사장님 공고 확인</b><span id="tally" aria-live="polite"></span></div></div>
<div class="head"><h1>공고 확인</h1><p>공고 원문의 조건과 가게 정보를 대조하고 근거 문구를 함께 보여드립니다. 정보 제공용이며 최종 자격은 주관기관이 판단합니다.</p></div>
<main>
<aside aria-label="우리 가게 정보">
<div class="seg" id="preset"><span class="thumb" id="thumb"></span><button data-p="food" aria-pressed="false" title="식품 제조, 보은군, 4명">식품 제조</button><button data-p="rest" aria-pressed="false" title="한식 음식점, 3명">한식 음식점</button><button data-p="shop" aria-pressed="false" title="의류 소매, 3명">의류 소매</button></div>
<p class="cap"><b>우리 가게 정보</b></p>
<div class="group">
<label class="line"><span>기준일</span><input id="as_of" type="date"></label>
<label class="line"><span>주된 업종 코드</span><input id="main_industry_ksic" inputmode="numeric" maxlength="5" placeholder="56111"></label>
<label class="line"><span>상시근로자 수</span><input id="employees" type="number" min="0" inputmode="numeric" placeholder="명"></label>
<label class="line"><span>최근 3년 평균 매출<small id="revenue_3y_avg_h"></small></span><input id="revenue_3y_avg" type="number" min="0" inputmode="numeric" placeholder="원"></label>
<label class="line"><span>2025년 매출<small id="revenue_2025_h"></small></span><input id="revenue_2025" type="number" min="0" inputmode="numeric" placeholder="원"></label>
<label class="line"><span>개업일</span><input id="founded_date" type="date"></label>
<label class="line"><span>영업 상태</span><select id="business_status"><option value="">선택</option><option>정상</option><option>휴업</option><option>폐업</option></select></label>
</div>
<p class="foot" style="margin-bottom:0">업종 코드는 사업자등록증에 있는 5자리 숫자입니다. 입력값은 이 화면의 판정에만 씁니다. 가게 이름이나 주민번호는 받지 않습니다.</p>
<button class="go" id="go" onclick="run(true)">공고 대조하기</button>
</aside>
<section id="out"><div id="common"></div><div id="list"><div class="empty"><b>왼쪽에 가게 정보를 넣어 주세요</b>값이 없으면 필요한 항목만 다시 여쭙니다.</div></div><div id="closed"></div></section>
</main>
<script>
const $=id=>document.getElementById(id);let profile={},prev={},showClosed=false,moreQ=false,seq=0,refocus=false;const opened=new Set();
const P={food:{main_industry_ksic:'10799',employees:4,revenue_3y_avg:300000000,revenue_2025:300000000,founded_date:'2020-03-02',business_status:'정상',hq_region:'보은군',factory_region:'보은군',site_region:'보은군',applicant_type:'기존 기업'},rest:{main_industry_ksic:'56111',employees:3,revenue_3y_avg:400000000,revenue_2025:90000000,founded_date:'2021-01-04',business_status:'정상',revenue_compare_period:'연도',revenue_before:100000000,revenue_latest:80000000},shop:{main_industry_ksic:'47411',employees:3,revenue_3y_avg:500000000,revenue_2025:80000000,founded_date:'2019-05-10',business_status:'정상'}};
const COMMON={tax_arrears:false,social_insurance_arrears:false,debt_default:false,gov_sanction:false};Object.values(P).forEach(p=>Object.assign(p,COMMON));
const FORM=['main_industry_ksic','employees','revenue_3y_avg','revenue_2025','founded_date','business_status'];
const CL={일치:'ok','확인 필요':'ask',불일치:'no','기관 판단':'org'};
const GLYPH={ok:'<path d="m6.2 10.3 2.6 2.6 5-5.8" fill="none" stroke="var(--group)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>',ask:'<path d="M10 5.6v5.4" fill="none" stroke="var(--group)" stroke-width="2" stroke-linecap="round"/><circle cx="10" cy="14" r="1.2" fill="var(--group)"/>',no:'<path d="m7 7 6 6M13 7l-6 6" fill="none" stroke="var(--group)" stroke-width="2" stroke-linecap="round"/>'};
const mark=c=>`<svg class="mark ${c}" width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="9" fill="currentColor"/>${GLYPH[c]}</svg>`;
const CHEV='<svg class="chev" width="9" height="14" viewBox="0 0 9 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m1.5 1.5 5.5 5.5-5.5 5.5"/></svg>';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const post=(u,b)=>fetch(u,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()});
function won(v){v=Number(v);if(!v)return '';const e=Math.floor(v/1e8),m=Math.round(v%1e8/1e4);return (e?e+'억 ':'')+(m?m.toLocaleString()+'만 ':'')+'원'}
function hints(){['revenue_3y_avg','revenue_2025'].forEach(k=>$(k+'_h').textContent=won($(k).value))}['revenue_3y_avg','revenue_2025'].forEach(k=>$(k).addEventListener('input',hints));
$('as_of').value=new Date().toISOString().slice(0,10);
function setSeg(k){const bs=[...document.querySelectorAll('#preset button')],i=bs.findIndex(b=>b.dataset.p===k);bs.forEach(b=>b.setAttribute('aria-pressed',b.dataset.p===k));$('thumb').style.opacity=i<0?0:1;if(i>=0)$('thumb').style.transform=`translateX(${i*100}%)`}
function pick(k){const v=P[k];if(!v)return;profile={...v};FORM.forEach(f=>$(f).value=v[f]??'');setSeg(k);hints();prev={};opened.clear();run()}
$('preset').onclick=e=>{const b=e.target.closest('button');if(b)pick(b.dataset.p)};FORM.forEach(f=>$(f).addEventListener('input',()=>setSeg(null)));
function read(){FORM.forEach(k=>{const raw=$(k).value;if(raw==='')delete profile[k];else profile[k]=($(k).type==='number')?Number(raw):raw})}
function when(x,asOf){const end=Array.isArray(x.period_value)&&x.period_value[1];if(!end||x.period!=='공고상 기간 내')return esc(x.period);const d=Math.round((new Date(end.slice(0,10))-new Date(asOf))/864e5);return `<strong>공고상 마감 ${Number(end.slice(5,7))}월 ${Number(end.slice(8,10))}일</strong> (${d===0?'오늘':d+'일 남음'})`}
const FLAG={'조기 마감 가능 표시':'예산 소진 시 조기 마감 가능','일정 표기 불일치 표시':'공고 일정 표기 불일치','근거 충돌 표시':'공고 조건 표기 충돌'};
function row(x,asOf,i,ch){const key=x.id+(x.program||''),c=CL[x.status],on=opened.has(key);const sub=[when(x,asOf),x.flags.includes('기관 판단 표시')?'<em>기관 판단 항목 있음</em>':'',...x.flags.filter(f=>FLAG[f]).map(f=>FLAG[f]),ch?`<span class="was">변경: ${esc(ch)} → ${esc(x.status)}</span>`:''].filter(Boolean).join(' · ');
const need=x.status==='불일치'?`<span class="need no">공고와 다른 조건: ${x.conditions.filter(k=>x.deciding.includes(k.id)).slice(0,3).map(k=>esc(k.label)).join(', ')}</span>`:x.ask.length?`<span class="need">필요한 답 ${x.ask.length}개: ${x.ask.slice(0,3).map(a=>esc(a.label)).join(', ')}${x.ask.length>3?' 등':''}</span>`:'';
const ord={'불일치':0,'확인 필요':1,'기관 판단':2,'일치':3},conds=[...x.conditions].sort((a,b)=>ord[a.status]-ord[b.status]);
return `<article class="${ch?'changed':''}"><button class="row" aria-expanded="${on}" aria-controls="w${i}" onclick="tog('${esc(key)}',${i},this)">${mark(c)}<span class="t"><h3>${esc(x.title)}${x.program?' · '+esc(x.program):''}</h3><span class="sub">${sub}</span>${need}</span>${CHEV}</button><div class="drawer ${on?'on':''}" id="w${i}"><div><div class="inner"><div class="acts"><button class="act main" onclick="card(${i},this)">안내 받기</button>${x.url?`<a class="act" href="${esc(x.url)}" target="_blank" rel="noopener">공고 원문</a>`:''}${Array.isArray(x.period_value)&&x.period_value[1]?`<a class="act" href="/api/ics/${x.id}">달력에 추가</a>`:''}<button class="act" onclick="trace('${x.id}',${i})">에이전트 작업 기록</button></div><div id="c${i}"></div><div id="t${i}"></div><ul class="d-list">${conds.map(k=>`<li class="d"><span class="st ${CL[k.status]}">${esc(k.status)}</span><span>${esc(k.label)} <span class="why">${esc(k.why)}</span>${k.quote?`<span class="src">${k.page}쪽 “${esc(k.quote)}”</span>`:''}</span></li>`).join('')}</ul></div></div></div></article>`}
async function run(fromBtn){const my=++seq;read();$('go').disabled=true;$('go').textContent='대조 중';let r;const asOf=$('as_of').value;
try{r=await post('/api/judge',{profile,as_of:asOf})}catch(e){if(my===seq){$('list').innerHTML='<div class="empty"><b>결과를 불러오지 못했습니다</b>서버 연결을 확인한 뒤 공고 대조하기를 다시 눌러 주세요.</div>';$('common').innerHTML='';$('tally').innerHTML='';$('closed').innerHTML='';$('go').disabled=false;$('go').textContent='공고 대조하기'}return}
if(my!==seq)return;const closed=r.results.filter(x=>x.period==='마감').length;r.results=r.results.filter(x=>showClosed||x.period!=='마감');
const c={일치:0,'확인 필요':0,불일치:0};r.results.forEach(x=>c[x.status]++);
// 같은 질문은 한 번만 묻고, 영향받는 공고가 많은 질문부터 보여준다. 이미 불일치인 공고 때문에는 묻지 않는다.
const cnt={},meta={};r.results.filter(x=>x.status!=='불일치').forEach(x=>x.ask.forEach(a=>{cnt[a.field]=(cnt[a.field]||0)+1;meta[a.field]=a}));const allF=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]);const fields=moreQ?allF:allF.slice(0,5);
let q={};if(fields.length){try{q=await post('/api/questions',{fields})}catch(e){q={}}if(my!==seq)return}
$('tally').innerHTML=`<span class="t-ok"><i>${c['일치']}</i>일치</span><span class="t-ask"><i>${c['확인 필요']}</i>확인 필요</span><span class="t-no"><i>${c['불일치']}</i>불일치</span>`;
$('common').innerHTML=allF.length?`<div class="sec" style="margin-bottom:26px"><p class="cap"><b>몇 가지만 여쭙겠습니다</b></p><div class="group">${fields.map(f=>ask(meta[f],q[f],cnt[f])).join('')}${allF.length>5?`<button class="more" onclick="moreQ=!moreQ;run()">${moreQ?'접기':`질문 ${allF.length-5}개 더 보기`}</button>`:''}</div><p class="foot" style="margin-bottom:0">한 번 답하면 모든 공고에 반영됩니다. 답을 모르면 비워 두셔도 됩니다.</p></div>`:'';
const now={};let i=-1;const SEC=[['일치','공고 조건 일치'],['확인 필요','확인 필요'],['불일치','공고 조건 불일치']];
$('list').innerHTML=r.results.length?SEC.map(([s,name])=>{const xs=r.results.filter(x=>x.status===s);if(!xs.length)return '';return `<div class="sec"><p class="cap"><b>${name}</b>${xs.length}건</p><div class="group">${xs.map(x=>{i++;const key=x.id+(x.program||'');now[key]=x.status;const ch=prev[key]&&prev[key]!==x.status?prev[key]:null;x._i=i;return row(x,asOf,i,ch)}).join('')}</div></div>`}).join(''):'<div class="empty"><b>접수 기간 안의 공고가 없습니다</b>아래에서 마감 공고도 볼 수 있습니다.</div>';
$('closed').innerHTML=`<label class="toggle">마감 공고 ${closed}건도 보기<input type="checkbox" role="switch" ${showClosed?'checked':''} onchange="showClosed=this.checked;run()"></label>`;
window.R=[];r.results.forEach(x=>{if(x._i!==undefined)R[x._i]=x});prev=now;$('go').disabled=false;$('go').textContent='공고 대조하기';if(fromBtn&&innerWidth<=860)$('out').scrollIntoView({behavior:'smooth'});if(refocus){refocus=false;const f=document.querySelector('#common button,#common input,#common select');if(f)f.focus({preventScroll:true})}}
function ask(a,q,n){const t=`<div class="qt">${esc(q||a.label)}<small>공고 ${n}건 관련</small></div>`;const lb=esc(q||a.label);const i=a.options?`<select aria-label="${lb}" onchange="ans('${a.field}',this.value)"><option value="">선택</option>${a.options.map(o=>`<option>${esc(o)}</option>`).join('')}</select>`:a.kind==='bool'?`<div class="yn" role="group" aria-label="${lb}"><button onclick="ans('${a.field}',true)">예</button><button onclick="ans('${a.field}',false)">아니오</button></div>`:`<input aria-label="${lb}" type="${a.kind==='text'?'text':a.kind}" placeholder="${a.kind==='number'?'숫자 입력':a.kind==='text'?'입력':''}" onchange="ans('${a.field}',this.value,'${a.kind}')">`;return `<div class="q">${t}${i}</div>`}
function ans(f,v,k){if(v===null||v==='')delete profile[f];else profile[f]=k==='number'?Number(v):v;if(FORM.includes(f))$(f).value=v;refocus=true;run()}
function tog(key,i,b){const on=!$('w'+i).classList.contains('on');$('w'+i).classList.toggle('on',on);b.setAttribute('aria-expanded',on);on?opened.add(key):opened.delete(key)}
async function card(i,b){b.disabled=true;b.textContent='작성 중';const x=R[i];try{const r=await post('/api/card',{id:x.id,program:x.program,profile,as_of:$('as_of').value});const c=r.card;$('c'+i).innerHTML=`<div class="guide"><b>${esc(c.headline)}</b><p>${esc(c.summary)}</p>${c.todo.length?'<b>할 일</b><ul>'+c.todo.map(t=>`<li>${esc(t)}</li>`).join('')+'</ul>':''}${c.check_items.length?'<b>확인할 것</b><ul>'+c.check_items.map(t=>`<li>${esc(t)}</li>`).join('')+'</ul>':''}<p class="foot">${esc(c.notice)}</p></div>`}catch(e){$('c'+i).innerHTML='<p class="err">안내를 만들지 못했습니다. 안내 받기를 다시 눌러 주세요.</p>'}b.disabled=false;b.textContent='안내 받기'}
async function trace(id,i){if($('t'+i).innerHTML){$('t'+i).innerHTML='';return}try{const r=await fetch('/api/trace/'+id).then(r=>r.json());$('t'+i).innerHTML=r.length?`<ol class="log">${r.map(t=>`<li><b>${esc({extract:'문서 해석',validate:'규칙 검사',verify:'근거 검증',finalize:'총괄 확정'}[t.tool]||t.tool)}</b><span>${esc(summ(t))}</span></li>`).join('')}</ol>`:'<p class="err">이 공고는 작업 기록이 없습니다.</p>'}catch(e){$('t'+i).innerHTML='<p class="err">작업 기록을 불러오지 못했습니다.</p>'}}
function summ(t){const r=t.result||{};if(t.tool==='extract')return `조건 ${r.n_conditions}개 (${r.extract_round}회차)`;if(t.tool==='validate')return `SHACL ${r.shacl_ok?'통과':'위반'}, 인용 오류 ${(r.quote_errors||[]).length}건, 판정 불가 ${(r.lint_errors||[]).length}건`;if(t.tool==='verify')return ((r.issues||[]).length?`지적 ${(r.issues||[]).length}건: ${(r.issues[0].detail||'').slice(0,90)}…`:'지적 없음')+(r.dropped_without_source?` (원문 근거 없는 지적 ${r.dropped_without_source}건 제외)`:'');if(t.tool==='finalize')return (r.unresolved||[]).length?`미해결 ${r.unresolved.length}건`:'미해결 없음';return ''}
const q0=new URLSearchParams(location.search).get('preset');if(q0&&P[q0])pick(q0);
